<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="metaTitle">CODEX MOD CREATE</title>
    <meta name="description" id="metaDescription" content="Download latest modded apps and games">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0f0f1a; color: #e0e0f0; line-height: 1.6; }
        .container { max-width: 1300px; margin: 0 auto; padding: 20px; }
        header { background: #1a1a2e; padding: 20px 0; border-bottom: 1px solid #2a2a40; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); background: rgba(26,26,46,0.95); }
        .header-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, #a855f7, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav { display: flex; gap: 20px; align-items: center; }
        .nav button { color: #a0a0c0; background: none; border: none; cursor: pointer; font-size: 1rem; padding: 8px 16px; border-radius: 30px; transition: 0.3s; }
        .nav button:hover { color: #fff; background: #2a2a40; }
        #adultBtn { color: #ff6b6b; }
        .ad-banner { background: #1e1e30; border-radius: 12px; padding: 20px; margin: 30px 0; text-align: center; border: 1px solid #2d2d44; min-height: 100px; display: flex; align-items: center; justify-content: center; color: #6b6b8b; }
        .filters { display: flex; gap: 15px; flex-wrap: wrap; margin: 30px 0; }
        .filter-btn { background: #1e1e30; border: 1px solid #2d2d44; color: #b0b0d0; padding: 8px 20px; border-radius: 30px; cursor: pointer; transition: 0.3s; font-size: 0.95rem; }
        .filter-btn.active, .filter-btn:hover { background: #3b82f6; border-color: #3b82f6; color: white; }
        
        /* Grid for apps and games: 3 columns always */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        /* Grid for videos: single column */
        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        /* Card style (used by all) */
        .card {
            background: #161627;
            border-radius: 16px;
            padding: 15px;
            border: 1px solid #2a2a40;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #4f4f8f;
            box-shadow: 0 20px 30px -10px #00000080;
        }

        /* Make video card clickable */
        .video-card {
            cursor: pointer;
        }

        /* Thumbnail common */
        .thumbnail {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 10px;
            border: 2px solid #2d2d44;
        }
        /* Apps & games thumbnail */
        .content-grid .thumbnail {
            height: 120px;
        }
        /* Videos thumbnail - larger */
        .video-grid .thumbnail {
            height: 200px;
        }

        .title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .video-grid .title {
            font-size: 1.3rem;
            white-space: normal;
        }
        .category {
            color: #8b8bb0;
            font-size: 0.7rem;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .video-grid .category {
            font-size: 0.9rem;
        }
        .description {
            color: #b0b0d0;
            font-size: 0.8rem;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }
        .video-grid .description {
            font-size: 1rem;
            -webkit-line-clamp: 3;
        }
        .action-btn {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            padding: 8px 12px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
            font-weight: 500;
            transition: 0.3s;
            font-size: 0.85rem;
        }
        /* No button for videos anymore, but keep for apps/games */
        .video-grid .action-btn {
            display: none; /* hide watch button on video cards */
        }
        .action-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1e1e30; padding: 40px; border-radius: 30px; text-align: center; max-width: 400px; border: 1px solid #3b82f6; }
        .modal h2 { margin-bottom: 20px; }
        .modal-buttons { display: flex; gap: 20px; justify-content: center; margin-top: 30px; }
        .modal-btn { padding: 12px 30px; border-radius: 40px; border: none; cursor: pointer; font-weight: 600; }
        .confirm { background: #3b82f6; color: white; }
        .deny { background: #2a2a40; color: #b0b0d0; }
        .adult-tabs { display: flex; gap: 20px; margin: 30px 0 20px; border-bottom: 1px solid #2a2a40; padding-bottom: 10px; }
        .adult-tab { padding: 10px 25px; background: #1e1e30; border-radius: 40px; cursor: pointer; border: 1px solid #2d2d44; }
        .adult-tab.active { background: #8b5cf6; border-color: #8b5cf6; }
        
        /* Video Overlay - YouTube style */
        .video-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 2000;
            overflow-y: auto;
            padding: 20px;
        }
        .video-player-container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        .video-ad {
            background: #1e1e30;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            min-height: 100px;
        }
        .video-main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 20px;
            background: #000;
        }
        .video-wrapper iframe,
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .video-info {
            margin: 15px 0;
            color: white;
        }
        .video-info h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        .video-info p {
            color: #b0b0d0;
        }
        .playlist {
            background: #161627;
            border-radius: 20px;
            padding: 15px;
            max-height: 600px;
            overflow-y: auto;
        }
        .playlist h3 {
            margin-bottom: 15px;
            color: #b0b0d0;
            font-size: 1.2rem;
        }
        .playlist-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .playlist-item {
            display: flex;
            gap: 12px;
            background: #1e1e30;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            transition: 0.3s;
            align-items: center;
        }
        .playlist-item:hover {
            background: #2a2a40;
        }
        .playlist-item img {
            width: 120px;
            height: 68px;
            border-radius: 8px;
            object-fit: cover;
        }
        .playlist-item .item-title {
            font-size: 0.95rem;
            color: white;
            font-weight: 500;
            flex: 1;
        }
        .countdown-container {
            text-align: center;
            margin: 20px 0;
        }
        .circular-timer {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #2a2a40;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
            font-weight: bold;
            border: 4px solid #3b82f6;
            color: white;
        }
        .download-now-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
            margin: 20px auto;
        }
        .close-video {
            display: block;
            margin: 30px auto 0;
            padding: 12px 40px;
            background: #3b82f6;
            border: none;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }
        @media (max-width: 800px) {
            .video-main-content {
                grid-template-columns: 1fr;
            }
            .playlist {
                max-height: 400px;
            }
            .playlist-item img {
                width: 100px;
                height: 56px;
            }
        }
        footer {
            margin-top: 60px;
            padding: 30px 0;
            border-top: 1px solid #1e1e30;
            text-align: center;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 20px;
        }
        .social-links a {
            color: #a0a0c0;
            font-size: 1.8rem;
            transition: 0.3s;
        }
        .social-links a:hover {
            color: white;
            transform: translateY(-3px);
        }
        .loading, .no-items {
            text-align: center;
            padding: 50px;
            color: #6b6b8b;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Age Gate Modal -->
    <div id="ageGate" class="modal" style="display: flex;">
        <div class="modal-content">
            <h2>🔞 Age Verification</h2>
            <p>You must be 18 or older to access adult content.</p>
            <div class="modal-buttons">
                <button class="modal-btn confirm" onclick="verifyAge(true)">I am 18+</button>
                <button class="modal-btn deny" onclick="verifyAge(false)">I am under 18</button>
            </div>
        </div>
    </div>

    <!-- Video / Download Overlay -->
    <div id="videoOverlay" class="video-overlay">
        <div class="video-player-container">
            <div id="videoAdContainer" class="video-ad" style="display: none;"></div>
            <div id="countdownContainer" class="countdown-container" style="display: none;">
                <div class="circular-timer" id="timerDisplay">10</div>
                <button class="download-now-btn" id="downloadNowBtn">Download Now</button>
            </div>
            <div id="videoMainContent" class="video-main-content" style="display: none;">
                <div class="video-left">
                    <div class="video-wrapper">
                        <video id="mainVideo" controls style="display:none;"></video>
                        <iframe id="youtubePlayer" style="display:none;" frameborder="0" allowfullscreen></iframe>
                    </div>
                    <div class="video-info">
                        <h2 id="currentVideoTitle"></h2>
                        <p id="currentVideoDesc"></p>
                    </div>
                </div>
                <div class="playlist">
                    <h3>Up Next</h3>
                    <div id="playlistContainer" class="playlist-grid"></div>

            </div>
            <button class="close-video" onclick="closeVideo()">Close</button>
        </div>
    </div>

    <header>
        <div class="container header-content">
            <div class="logo" id="siteName">CODEX MOD CREATE</div>
            <div class="nav">
                <button onclick="showSection('normal')">Home</button>
                <button id="adultBtn" onclick="showAdultSection()">18+ Zone</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="adBanner" class="ad-banner">Loading advertisement...</div>

        <div id="normalSection">
            <div class="filters" id="filterContainer"></div>
            <div id="appsGrid" class="content-grid">
                <div class="loading">Loading apps...</div>
            </div>
        </div>

        <div id="adultSection" style="display: none;">
            <div class="adult-tabs">
                <button class="adult-tab active" onclick="showAdultTab('videos')">Videos</button>
                <button class="adult-tab" onclick="showAdultTab('games')">Games</button>
            </div>
            <div id="adultVideos" class="video-grid"></div>
            <div id="adultGames" class="content-grid" style="display: none;"></div>
        </div>
    </main>

    <footer>
        <div class="social-links" id="socialLinks"></div>
        <p>&copy; 2025 <span id="footerSiteName">CODEX MOD CREATE</span>. All rights reserved.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAan-u220WR6aLzD-6Ti_alwWHtTmTDbZ4",
            authDomain: "vipemote-e492e.firebaseapp.com",
            projectId: "vipemote-e492e",
            storageBucket: "vipemote-e492e.firebasestorage.app",
            messagingSenderId: "984753929214",
            appId: "1:984753929214:web:3f85f32a4764bebed31eaf",
            measurementId: "G-L5DERSM2JV"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // State
        let ageVerified = false;
        let allApps = [], allVideos = [], allGames = [], categories = [];
        let ads = { banner: '', videoPreroll: '', downloadInterstitial: '' };
        let siteSettings = { name: 'CODEX MOD CREATE', metaTitle: 'CODEX MOD CREATE', metaDesc: 'Download latest modded apps and games', social: { instagram: '#', telegram: '#', youtube: '#', github: '#' } };
        let currentVideoCallback = null;
        let currentOverlayType = null;
        let countdownInterval = null;
        let countdownSeconds = 10;

        // DOM elements
        const ageGate = document.getElementById('ageGate');
        const normalSection = document.getElementById('normalSection');
        const adultSection = document.getElementById('adultSection');
        const adultBtn = document.getElementById('adultBtn');
        const filterContainer = document.getElementById('filterContainer');
        const appsGrid = document.getElementById('appsGrid');
        const adultVideosDiv = document.getElementById('adultVideos');
        const adultGamesDiv = document.getElementById('adultGames');
        const videoOverlay = document.getElementById('videoOverlay');
        const mainVideo = document.getElementById('mainVideo');
        const youtubePlayer = document.getElementById('youtubePlayer');
        const videoAdContainer = document.getElementById('videoAdContainer');
        const adBanner = document.getElementById('adBanner');
        const currentVideoTitle = document.getElementById('currentVideoTitle');
        const currentVideoDesc = document.getElementById('currentVideoDesc');
        const playlistContainer = document.getElementById('playlistContainer');
        const siteNameSpan = document.getElementById('siteName');
        const footerSiteName = document.getElementById('footerSiteName');
        const metaTitle = document.getElementById('metaTitle');
        const metaDescription = document.getElementById('metaDescription');
        const socialLinksDiv = document.getElementById('socialLinks');
        const countdownContainer = document.getElementById('countdownContainer');
        const timerDisplay = document.getElementById('timerDisplay');
        const downloadNowBtn = document.getElementById('downloadNowBtn');
        const videoMainContent = document.getElementById('videoMainContent');

        function injectAd(container, html) {
            if (!container) return;
            container.innerHTML = '';
            if (!html) return;
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            while (tempDiv.firstChild) {
                container.appendChild(tempDiv.firstChild);
            }
            const scripts = container.querySelectorAll('script');
            scripts.forEach(oldScript => {
                const newScript = document.createElement('script');
                if (oldScript.src) {
                    newScript.src = oldScript.src;
                } else {
                    newScript.textContent = oldScript.textContent;
                }
                Array.from(oldScript.attributes).forEach(attr => {
                    newScript.setAttribute(attr.name, attr.value);
                });
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        window.verifyAge = (isAdult) => {
            if (isAdult) {
                ageVerified = true;
                ageGate.style.display = 'none';
            } else {
                alert('You are not allowed to view adult content.');
                ageGate.style.display = 'none';
            }
        };

        window.showAdultSection = () => {
            if (!ageVerified) {
                ageGate.style.display = 'flex';
                return;
            }
            normalSection.style.display = 'none';
            adultSection.style.display = 'block';
            loadAdultContent();
        };

        window.showSection = (section) => {
            if (section === 'normal') {
                normalSection.style.display = 'block';
                adultSection.style.display = 'none';
            }
        };

        window.showAdultTab = (tab) => {
            document.querySelectorAll('.adult-tab').forEach(t => t.classList.remove('active'));
            if (tab === 'videos') {
                document.querySelectorAll('.adult-tab')[0].classList.add('active');
                adultVideosDiv.style.display = 'grid';
                adultGamesDiv.style.display = 'none';
            } else {
                document.querySelectorAll('.adult-tab')[1].classList.add('active');
                adultVideosDiv.style.display = 'none';
                adultGamesDiv.style.display = 'grid';
            }
        };

        async function loadAll() {
            await loadSiteSettings();
            await loadAds();
            await loadCategories();
            await loadApps();
            await loadVideos();
            await loadGames();
        }

        async function loadSiteSettings() {
            try {
                const doc = await db.collection('settings').doc('site').get();
                if (doc.exists) {
                    siteSettings = doc.data();
                }
                document.title = siteSettings.metaTitle || 'CODEX MOD CREATE';
                if (metaDescription) metaDescription.content = siteSettings.metaDesc || 'Download latest modded apps and games';
                if (siteNameSpan) siteNameSpan.textContent = siteSettings.name || 'CODEX MOD CREATE';
                if (footerSiteName) footerSiteName.textContent = siteSettings.name || 'CODEX MOD CREATE';
                const social = siteSettings.social || {};
                let socialHtml = '';
                if (social.instagram) socialHtml += `<a href="${social.instagram}" target="_blank"><i class="fab fa-instagram"></i></a>`;
                if (social.telegram) socialHtml += `<a href="${social.telegram}" target="_blank"><i class="fab fa-telegram"></i></a>`;
                if (social.youtube) socialHtml += `<a href="${social.youtube}" target="_blank"><i class="fab fa-youtube"></i></a>`;
                if (social.github) socialHtml += `<a href="${social.github}" target="_blank"><i class="fab fa-github"></i></a>`;
                socialLinksDiv.innerHTML = socialHtml;
            } catch (e) { console.error(e); }
        }

        async function loadAds() {
            try {
                const doc = await db.collection('settings').doc('ads').get();
                if (doc.exists) ads = doc.data();
                injectAd(adBanner, ads.banner || '<span style="color:#6b6b8b;">Ad space</span>');
            } catch (e) { console.error(e); }
        }

        async function loadCategories() {
            const snapshot = await db.collection('categories').get();
            categories = snapshot.docs.map(d => d.data().name);
            renderFilters();
        }

        function renderFilters() {
            let html = '<button class="filter-btn active" data-category="all">All</button>';
            categories.forEach(cat => {
                html += `<button class="filter-btn" data-category="${cat}">${cat}</button>`;
            });
            filterContainer.innerHTML = html;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filterApps(btn.dataset.category);
                });
            });
        }

        async function loadApps() {
            const snapshot = await db.collection('apps').get();
            allApps = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            filterApps('all');
        }

        function filterApps(category) {
            const filtered = category === 'all' ? allApps : allApps.filter(a => a.category === category);
            if (!filtered.length) {
                appsGrid.innerHTML = '<div class="no-items">No apps found</div>';
                return;
            }
            let html = '';
            filtered.forEach(app => {
                html += `
                    <div class="card">
                        <img src="${app.icon || 'https://via.placeholder.com/280x120?text=App'}" class="thumbnail" onerror="this.src='https://via.placeholder.com/280x120?text=Error'">
                        <div class="title">${app.name}</div>
                        <div class="category">${app.category || 'Uncategorized'}</div>
                        <div class="description">${app.description || ''}</div>
                        <button class="action-btn" onclick="handleDownload('${app.downloadUrl}')">Download</button>
                    </div>
                `;
            });
            appsGrid.innerHTML = html;
        }

        async function loadVideos() {
            const snapshot = await db.collection('videos').get();
            allVideos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderVideos();
        }

        function renderVideos() {
            if (!allVideos.length) {
                adultVideosDiv.innerHTML = '<div class="no-items">No videos yet</div>';
                return;
            }
            let html = '';
            allVideos.forEach(v => {
                html += `
                    <div class="card video-card" onclick="playVideo('${v.id}')">
                        <img src="${v.thumbnail || 'https://via.placeholder.com/280x200?text=Video'}" class="thumbnail">
                        <div class="title">${v.title}</div>
                        <div class="category">${v.category || '18+'}</div>
                        <div class="description">${v.description || ''}</div>
                        <!-- Watch button removed, card is clickable -->
                    </div>
                `;
            });
            adultVideosDiv.innerHTML = html;
        }

        async function loadGames() {
            const snapshot = await db.collection('games').get();
            allGames = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderGames();
        }

        function renderGames() {
            if (!allGames.length) {
                adultGamesDiv.innerHTML = '<div class="no-items">No games yet</div>';
                return;
            }
            let html = '';
            allGames.forEach(g => {
                html += `
                    <div class="card">
                        <img src="${g.thumbnail || 'https://via.placeholder.com/280x120?text=Game'}" class="thumbnail">
                        <div class="title">${g.name}</div>
                        <div class="category">${g.category || '18+'}</div>
                        <div class="description">${g.description || ''}</div>
                        <button class="action-btn" onclick="playGame('${g.gameUrl}', '${g.type}')">Play</button>
                    </div>
                `;
            });
            adultGamesDiv.innerHTML = html;
        }

        function loadAdultContent() {
            if (!allVideos.length) loadVideos();
            if (!allGames.length) loadGames();
        }

        window.handleDownload = (url) => {
            if (!url) return alert('No download link');
            if (ads.downloadInterstitial) {
                currentVideoCallback = () => { window.open(url, '_blank'); };
                showAdOverlay(ads.downloadInterstitial, 'download');
            } else {
                window.open(url, '_blank');
            }
        };

        window.playVideo = (videoId) => {
            const video = allVideos.find(v => v.id === videoId);
            if (!video) return;
            if (ads.videoPreroll) {
                currentVideoCallback = () => { actuallyPlayVideo(video); };
                showAdOverlay(ads.videoPreroll, 'video');
            } else {
                actuallyPlayVideo(video);
            }
        };

        function actuallyPlayVideo(video) {
            videoOverlay.style.display = 'flex';
            countdownContainer.style.display = 'none';
            videoMainContent.style.display = 'grid';
            currentVideoTitle.textContent = video.title;
            currentVideoDesc.textContent = video.description || '';
            if (video.videoUrl.includes('youtube.com') || video.videoUrl.includes('youtu.be')) {
                let vid = video.videoUrl.split('v=')[1] || video.videoUrl.split('/').pop();
                if (vid.includes('&')) vid = vid.split('&')[0];
                youtubePlayer.src = `https://www.youtube.com/embed/${vid}?autoplay=1`;
                youtubePlayer.style.display = 'block';
                mainVideo.style.display = 'none';
            } else {
                mainVideo.src = video.videoUrl;
                mainVideo.style.display = 'block';
                youtubePlayer.style.display = 'none';
                mainVideo.play();
            }
            renderPlaylist(video.id);
        }

        function renderPlaylist(currentId) {
            let html = '';
            allVideos.forEach(v => {
                if (v.id === currentId) return;
                html += `
                    <div class="playlist-item" onclick="playVideo('${v.id}')">
                        <img src="${v.thumbnail || 'https://via.placeholder.com/120x68?text=Video'}" alt="">
                        <div class="item-title">${v.title}</div>
                    </div>
                `;
            });
            playlistContainer.innerHTML = html || '<div>No other videos</div>';
        }

        window.playGame = (gameUrl, type) => {
            if (type === 'playable') {
                if (ads.downloadInterstitial) {
                    currentVideoCallback = () => { window.open(gameUrl, '_blank'); };
                    showAdOverlay(ads.downloadInterstitial, 'download');
                } else {
                    window.open(gameUrl, '_blank');
                }
            } else {
                handleDownload(gameUrl);
            }
        };

        function showAdOverlay(adHtml, type) {
            currentOverlayType = type;
            videoAdContainer.style.display = 'block';
            injectAd(videoAdContainer, adHtml);
            
            // Common countdown for both video and download
            countdownContainer.style.display = 'block';
            videoMainContent.style.display = 'none';
            downloadNowBtn.style.display = 'none'; // hidden initially
            timerDisplay.textContent = countdownSeconds;

            let seconds = countdownSeconds;
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                seconds--;
                timerDisplay.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    timerDisplay.textContent = '0';
                    
                    if (type === 'download') {
                        // Show download button
                        downloadNowBtn.style.display = 'inline-block';
                    } else {
                        // Video: auto-close ad and play video
                        closeVideo(); // this will trigger the callback
                    }
                }
            }, 1000);

            if (type === 'download') {
                downloadNowBtn.onclick = () => {
                    if (currentVideoCallback) {
                        currentVideoCallback();
                        currentVideoCallback = null;
                    }
                    closeVideo();
                };
            }

            videoOverlay.style.display = 'flex';
        }

        window.closeVideo = () => {
            videoOverlay.style.display = 'none';
            videoAdContainer.innerHTML = '';
            videoAdContainer.style.display = 'none';
            countdownContainer.style.display = 'none';
            videoMainContent.style.display = 'none';
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            mainVideo.pause();
            mainVideo.src = '';
            youtubePlayer.src = '';
            
            // If there's a callback (video playback), call it now
            if (currentVideoCallback) {
                currentVideoCallback();
                currentVideoCallback = null;
            }
            currentOverlayType = null;
        };

        // Initial load
        loadAll();
    </script>
</body>
</html>
